aid: hometouch
name: HomeTouch
description: HomeTouch (myhometouch.com) is a UK-based live-in home care marketplace
  founded in 2015 by Dr Jamie Wilson, a former NHS dementia specialist. The CQC-regulated
  service connects families with vetted professional carers for live-in, overnight,
  and visiting care, with a specialism in dementia and complex-needs support, hospital
  discharge, end-of-life, respite, and companionship care. Backed by 500 Global and
  other impact investors, HomeTouch operates a carer marketplace alongside a fully
  managed care service. The company publishes no public developer program or API;
  this profile tracks its identity, published web properties, and domain security
  posture for the API Evangelist network.
